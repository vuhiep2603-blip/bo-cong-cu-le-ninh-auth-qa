name: Deploy Full Task Management QA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-qa-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated source PR #4 at reviewed commit
        uses: actions/checkout@v4
        with:
          repository: vuhiep2603-blip/bo-cong-cu-le-ninh-demo
          ref: e71a522013ff0bd5a42715f29128948193300905
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/nhiem-vu/package-lock.json

      - name: Build production application for Firebase Spark
        working-directory: source/nhiem-vu
        env:
          VITE_FIREBASE_API_KEY: AIzaSyD9E6USFDF7bdnhWTwYWLkrlQbZGso2qQ4
          VITE_FIREBASE_AUTH_DOMAIN: vpduln-quanlynhiemvu.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: vpduln-quanlynhiemvu
          VITE_FIREBASE_APP_ID: '1:562123800725:web:2a1a5411d08c27622e1b9c'
        run: |
          npm ci
          npm install --no-save --package-lock=false tesseract.js@5.1.1 @tesseract.js-data/vie@1.0.0
          npm run build

      - name: Assemble QA Pages artifact outside source checkout
        run: |
          node source/nhiem-vu/package-pages.mjs "$RUNNER_TEMP/le-ninh-auth-qa-site"
          test -f "$RUNNER_TEMP/le-ninh-auth-qa-site/nhiem-vu/index.html"
          test -f "$RUNNER_TEMP/le-ninh-auth-qa-site/giay-moi.html"
          test -f "$RUNNER_TEMP/le-ninh-auth-qa-site/lich-cong-tac.html"
          if find "$RUNNER_TEMP/le-ninh-auth-qa-site" -type f | grep -E '/(\.env\.local|seed-demo\.mjs|demo\.html)$'; then
            echo "Demo/private test files unexpectedly included" >&2
            exit 1
          fi

      - name: Bundle same-origin Vietnamese OCR engine, WASM and traineddata
        run: |
          set -euo pipefail
          source_dir=source/nhiem-vu/node_modules
          output="$RUNNER_TEMP/le-ninh-auth-qa-site/nhiem-vu/ocr"
          mkdir -p "$output/core" "$output/lang"
          cp "$source_dir/tesseract.js/dist/tesseract.min.js" "$output/tesseract.min.js"
          cp "$source_dir/tesseract.js/dist/worker.min.js" "$output/worker.min.js"
          find "$source_dir/tesseract.js-core" -maxdepth 1 -type f \( -name '*.wasm' -o -name '*.js' \) -exec cp '{}' "$output/core/" \;
          language="$(find "$source_dir/@tesseract.js-data/vie" -name 'vie.traineddata.gz' -type f | head -n 1)"
          test -n "$language"
          cp "$language" "$output/lang/vie.traineddata.gz"
          test -s "$output/lang/vie.traineddata.gz"
          test -s "$output/core/tesseract-core.wasm.js"
          test -s "$output/worker.min.js"
          du -sh "$output"

      - name: Smoke-test self-hosted Vietnamese OCR in Chromium
        working-directory: source/nhiem-vu
        run: |
          set -euo pipefail
          npx playwright install chromium
          python3 -m http.server 4180 --bind 127.0.0.1 --directory "$RUNNER_TEMP/le-ninh-auth-qa-site/nhiem-vu" >/tmp/le-ninh-ocr-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const require=createRequire(import.meta.url);
          const {chromium}=require('@playwright/test');
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage();
            await page.goto('http://127.0.0.1:4180/',{waitUntil:'domcontentloaded'});
            const text=await page.evaluate(async()=>{
              await new Promise((resolve,reject)=>{
                const script=document.createElement('script');
                script.src='/ocr/tesseract.min.js';
                script.onload=resolve;script.onerror=()=>reject(Error('OCR script unavailable'));
                document.head.appendChild(script);
              });
              const runtime=window.Tesseract;
              if(!runtime)throw Error('OCR library not initialized');
              const worker=await runtime.createWorker('vie',1,{
                workerPath:'/ocr/worker.min.js',corePath:'/ocr/core',langPath:'/ocr/lang',
                workerBlobURL:false,cacheMethod:'none'
              });
              try {
                const canvas=document.createElement('canvas');
                canvas.width=900;canvas.height=150;
                const ctx=canvas.getContext('2d');
                ctx.fillStyle='#fff';ctx.fillRect(0,0,900,150);
                ctx.fillStyle='#000';ctx.font='bold 43px Arial';
                ctx.fillText('NGAY 18 THANG 11 NAM 2026',20,90);
                const result=await worker.recognize(canvas);
                return result.data.text;
              } finally {await worker.terminate();}
            });
            if(!text.includes('2026'))throw Error('OCR could not read the local synthetic sample: '+text);
            console.log('Browser OCR loaded all local assets and recognized synthetic text:',text.trim());
          } finally {await browser.close();}
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/le-ninh-auth-qa-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
